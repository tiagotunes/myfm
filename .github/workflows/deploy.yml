name: Railway Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment: PRD
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install
      - run: npm test

      - name: Build project
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service backend --environment production --detach

      - name: Run migrations
        run: railway run --service backend --environment production "npm run migration:run:prod"
